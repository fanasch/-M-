<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คุณเป็นตัวละครสายไหนในอนิเมะ?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #ddd6fe 100%);
            min-height: 100vh;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            transform: scale(1.02);
            background-color: #f3e8ff;
            border-color: #c084fc;
        }
        .option-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div id="app-container" class="bg-white rounded-3xl shadow-xl w-full max-w-2xl overflow-hidden relative min-h-[400px]">
        
        <!-- Start Screen -->
        <div id="start-screen" class="p-8 md:p-12 text-center flex flex-col items-center justify-center h-full fade-in py-20">
            <h1 class="text-3xl md:text-4xl font-bold text-purple-600 mb-4 tracking-wide">✨ คุณเป็นตัวละคร<br>สายไหนในอนิเมะ? ✨</h1>
            <p class="text-gray-600 mb-8 text-lg">มาดูกันว่าถ้าคุณหลุดเข้าไปในโลกอนิเมะ คาแรกเตอร์ของคุณจะตกอยู่ในสายไหน (มีทั้งหมด 10 สาย!)</p>
            <button onclick="startQuiz()" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold text-xl py-4 px-12 rounded-full shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all">
                เริ่มทำแบบทดสอบ 💖
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden p-6 md:p-10 fade-in flex-col h-full">
            <div class="flex justify-between items-center mb-4">
                <button id="back-btn" onclick="goBack()" class="hidden text-purple-600 bg-purple-100 hover:bg-purple-200 px-3 py-1 rounded-full text-sm font-medium transition-colors">
                    ⬅️ ย้อนกลับ
                </button>
                <span class="text-sm font-medium text-purple-500 bg-purple-100 py-1 px-3 rounded-full ml-auto">ข้อที่ <span id="current-q-num">1</span> / 30</span>
            </div>
            
            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-8">
                <div id="progress-bar" class="bg-gradient-to-r from-purple-400 to-pink-400 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <h2 id="question-text" class="text-xl md:text-2xl font-semibold text-gray-800 mb-6 text-center leading-relaxed">
                <!-- Question will appear here -->
            </h2>

            <div id="options-container" class="space-y-3 mt-auto">
                <!-- Options will be generated here -->
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden p-8 md:p-12 text-center fade-in flex-col items-center justify-center py-16">
            <h3 class="text-lg font-medium text-gray-500 mb-2">ผลลัพธ์ของคุณคือ...</h3>
            <div class="text-6xl mb-4" id="result-emoji">🌸</div>
            <h2 id="result-title" class="text-3xl md:text-4xl font-bold text-purple-700 mb-4">M ขี้อาย</h2>
            <p id="result-desc" class="text-gray-600 text-lg mb-8 leading-relaxed">
                <!-- Description will appear here -->
            </p>
            <button onclick="resetQuiz()" class="bg-purple-100 text-purple-600 font-semibold text-lg py-3 px-8 rounded-full shadow hover:bg-purple-200 transition-all">
                🔄 ทำแบบทดสอบอีกครั้ง
            </button>
        </div>

    </div>

    <script>
        // Data for results
        const resultTypes = {
            m_shy: { title: "M ขี้อาย", emoji: "🌸", desc: "โดนแซวนิดหน่อยก็เขิน มักหลบหน้า พูดติด ๆ ขัด ๆ ยิ่งโดนแซวยิ่งทำตัวไม่ถูก น่าทะนุถนอมสุดๆ" },
            m_stubborn: { title: "M ปากแข็ง", emoji: "😤", desc: "ฟอร์มจัดมาก! ปากบอก 'ไม่ได้เป็น M ซะหน่อย!' แต่ชอบให้คนมาสนใจลึกๆ" },
            m_tsundere: { title: "M ซึนเดเระ", emoji: "츤", desc: "ด่าเขาก่อน แต่พอเขาแกล้งกลับดันเขินตัวม้วน 'ไม่ได้ชอบให้แกล้งย่ะ! ตาบ้า!'" },
            m_funny: { title: "M สายฮา", emoji: "😂", desc: "โดนแกล้งแล้วเล่นมุกต่อได้ ยอมเป็นตัวตลกของกลุ่ม มักทำให้ฉากดูผ่อนคลายและเป็นที่รักของเพื่อนๆ" },
            m_serious: { title: "M สายจริงจัง", emoji: "🖤", desc: "บุคลิกสุขุม ไม่ค่อยแสดงออก ชอบให้คนอื่นเป็นฝ่ายนำสถานการณ์ เก็บซ่อนความรู้สึกเก่ง" },
            m_challenge: { title: "M สายท้าทาย", emoji: "⚔️", desc: "ยิ่งถูกบอกว่า 'ทำไม่ได้' ยิ่งอยากลอง ชอบสถานการณ์ที่เสียเปรียบแล้วต้องเอาชนะ เลือดนักสู้พลุ่งพล่าน!" },
            m_bullied: { title: "M สายโดนแกล้ง", emoji: "😭", desc: "มักเป็นเป้าหมายประจำของเพื่อน โดนแกล้งซ้ำ ๆ จนกลายเป็นมุกประจำกลุ่ม แต่ลึกๆ ก็ชอบแหละ" },
            m_follower: { title: "M สายตามผู้นำ", emoji: "🎀", desc: "ชอบให้คนอื่นที่มั่นใจกว่าเป็นคนตัดสินใจ ตัวเองทำหน้าที่สนับสนุนและพร้อมเดินตามอย่างว่าง่าย" },
            m_unlucky: { title: "M สายซวย", emoji: "💀", desc: "ไม่ได้ตั้งใจจะเป็น M แต่เรื่องราวมักพาไปเจอสถานการณ์ที่โดนแกล้งหรือแจ็คพอตแตกตลอดเวลา สู้ๆ นะ!" },
            horny: { title: "สายหื่น", emoji: "🔥", desc: "สนใจเรื่องอย่างว่า มักเล่นมุกสองแง่สองง่าม หรือแสดงความสนใจออกมาค่อนข้างชัดเจน แอบร้ายนะเรา" },
            psycho: { title: "สายโรคจิต", emoji: "🔪", desc: "หมกมุ่น ยึดติด หวงแหน คลั่งรักแบบสุดโต่ง ไม่ค่อยแคร์ขอบเขตของคนอื่น ยันเดเระนิดๆ อันตรายหน่อยๆ" }
        };

        // 30 Questions mapped to categories
        const questions = [
            { q: "1. เมื่อเพื่อนแซวคุณว่าแอบชอบใครอยู่ คุณจะ...", 
              options: [{text: "หน้าแดง ทำตัวไม่ถูก หาทางหนี", type: "m_shy"}, {text: "โวยวาย 'ไม่ได้ชอบเว้ย! อย่ามามั่ว!'", type: "m_stubborn"}, {text: "ชกไหล่คนแซว 'บ้า! ใครชอบตาบั่นนั่นกันล่ะ!' แต่หน้าแดง", type: "m_tsundere"}, {text: "นั่งนิ่งๆ ปล่อยให้แซวไป ไม่สะทกสะท้าน", type: "m_serious"}] },
            { q: "2. เวลาทำงานกลุ่ม หน้าที่ของคุณคือ?", 
              options: [{text: "แล้วแต่หัวหน้าสั่งเลย พร้อมทำตาม", type: "m_follower"}, {text: "รับงานที่ยากที่สุด เพื่อพิสูจน์ตัวเอง", type: "m_challenge"}, {text: "คนที่โดนโยนงานให้เยอะที่สุดตลอด", type: "m_bullied"}, {text: "แอบสืบข้อมูลส่วนตัวของคนในกลุ่มว่าแอบอู้ไหม", type: "psycho"}] },
            { q: "3. ถ้าบังเอิญเจอคนที่แอบชอบเดินมาทางนี้ คุณจะ...", 
              options: [{text: "แอบมองรูปร่างหน้าตาแบบเน้นๆ", type: "horny"}, {text: "หลบหลังเสา ไม่กล้าสบตา", type: "m_shy"}, {text: "ทำเป็นเมิน เดินเชิดๆ ผ่านไป", type: "m_stubborn"}, {text: "แกล้งเดินชนแล้วด่า 'เดินดูทางบ้างสิยะ!'", type: "m_tsundere"}] },
            { q: "4. เดินสะดุดล้มกลางโรงอาหาร คุณจะทำอย่างไร?", 
              options: [{text: "ทำไมซวยแบบนี้เนี่ย บาดเจ็บอีกแล้ว", type: "m_unlucky"}, {text: "ลุกขึ้นมาโพสท่าฮาๆ กลบเกลื่อน", type: "m_funny"}, {text: "เพื่อนขำหนักมาก และคุณก็โดนล้อไปอีกนาน", type: "m_bullied"}, {text: "ปัดฝุ่นเงียบๆ แล้วเดินต่อเหมือนไม่มีอะไรเกิดขึ้น", type: "m_serious"}] },
            { q: "5. เพื่อนท้าให้เล่นเกมที่คุณเล่นไม่เก่งเลย คุณจะ...", 
              options: [{text: "รับคำท้า! ยิ่งแพ้ยิ่งอยากเอาชนะ", type: "m_challenge"}, {text: "'ไม่ได้อยากเล่นหรอกนะ แค่สงสารกลัวไม่มีคนเล่นด้วย'", type: "m_tsundere"}, {text: "แพ้รวดจนกลายเป็นสนามอารมณ์ของเพื่อน", type: "m_bullied"}, {text: "แพ้ตั้งแต่ตายังไม่เริ่ม เครื่องดับ เน็ตหลุด", type: "m_unlucky"}] },
            { q: "6. ถ้าเพื่อนสนิทลืมวันเกิดของคุณ...", 
              options: [{text: "งอนหนักมาก แต่ปากบอกไม่เป็นไร", type: "m_stubborn"}, {text: "แอบร้องไห้คนเดียวเงียบๆ", type: "m_shy"}, {text: "เก็บไว้เป็นบัญชีแค้น แอบตามสืบว่าไปทำอะไรมาถึงลืม", type: "psycho"}, {text: "ไม่ซีเรียส เดี๋ยวพรุ่งนี้ทวงย้อนหลังเอาฮา", type: "m_funny"}] },
            { q: "7. โดนทำโทษให้เต้นท่าแปลกๆ หน้าห้อง", 
              options: [{text: "เต้นจัดเต็มเกินเบอร์ หวังให้คนขำ", type: "m_funny"}, {text: "'ฝากไว้ก่อนเถอะ พวกบ้า!' เต้นไปด่าไป", type: "m_tsundere"}, {text: "เต้นไปยั่วๆ บดๆ เผื่อมีคนชอบ", type: "horny"}, {text: "เต้นผิดจังหวะ สะดุดล้มตอนจบพอดี", type: "m_unlucky"}] },
            { q: "8. เวลาไปเที่ยวกับแก๊งเพื่อน ใครเป็นคนวางแผน?", 
              options: [{text: "ใครจัดก็ไปหมดแหละ เดินตามอย่างเดียว", type: "m_follower"}, {text: "คนอื่นจัด เราเป็นฝ่ายโดนเทให้อยู่เฝ้าของตลอด", type: "m_unlucky"}, {text: "วางแผนเอง รัดกุม ตรงเวลาเป๊ะ", type: "m_serious"}, {text: "จัดทริปไปที่แปลกๆ ท้าทายขีดจำกัด", type: "m_challenge"}] },
            { q: "9. มีคนมาสารภาพรักกับคุณ แต่คุณไม่ได้ชอบเขา", 
              options: [{text: "ปฏิเสธด้วยการกวนโอ๊ยกลับไป", type: "m_funny"}, {text: "ปฏิเสธแบบเย็นชา สั้นๆ 'ไม่ล่ะ'", type: "m_serious"}, {text: "เขินจนทำอะไรไม่ถูก พูดขอโทษซ้ำๆ", type: "m_shy"}, {text: "โดนเพื่อนล้อเรื่องนี้ไปอีกสามเดือนเต็ม", type: "m_bullied"}] },
            { q: "10. คุณชอบตัวละครอนิเมะแบบไหน?", 
              options: [{text: "ตัวที่หุ่นแซ่บๆ เซอร์วิสเยอะๆ", type: "horny"}, {text: "ตัวร้ายที่โรคจิตๆ มีปมลึกๆ ร้ายลึกๆ", type: "psycho"}, {text: "ตัวเอกที่เก่งๆ เป็นผู้นำ เราอยากคอยซัพพอร์ต", type: "m_follower"}, {text: "ตัวที่ปากร้ายใจดี ซึนเดเระเหมือนเรา(?)", type: "m_tsundere"}] },
            { q: "11. เพื่อนแกล้งเอาขนมของคุณไปซ่อน", 
              options: [{text: "โวยวายเอาคืนมานะ! ฟอร์มจัด", type: "m_stubborn"}, {text: "โดนแกล้งจนชิน ปล่อยเบลอ", type: "m_bullied"}, {text: "ท้าแข่งเกม ใครชนะได้ขนมไป", type: "m_challenge"}, {text: "สืบจนรู้ว่าซ่อนที่ไหน แล้วแอบเอากรรไกรไปตัดเสื้อเพื่อน", type: "psycho"}] },
            { q: "12. อาจารย์เรียกตอบคำถามที่คุณไม่รู้คำตอบ", 
              options: [{text: "ยืนอ้ำอึ้ง หน้าแดง มือสั่น", type: "m_shy"}, {text: "ตอบมั่วๆ เอาฮาเข้าว่า", type: "m_funny"}, {text: "เพิ่งก้มหน้าหลบตา แต่อาจารย์ก็เรียกพอดี", type: "m_unlucky"}, {text: "ตอบไม่ได้ก็ยืนนิ่งๆ รับสภาพไป", type: "m_serious"}] },
            { q: "13. อยู่ในห้องน้ำแล้วทิชชู่หมด", 
              options: [{text: "นี่มันวันซวยอะไรของฉันเนี่ย!", type: "m_unlucky"}, {text: "ตะโกนขอความช่วยเหลือแบบไม่อายใคร", type: "m_funny"}, {text: "รอจนกว่าจะมีคนเดินเข้ามาแล้วค่อยให้ช่วย", type: "m_follower"}, {text: "หาทางเอาตัวรอดด้วยวิธีสุดท้าทาย", type: "m_challenge"}] },
            { q: "14. เห็นคนที่ชอบทำของตก คุณจะ...", 
              options: [{text: "แอบเก็บไปสูดดมกลิ่น และไม่คืน", type: "psycho"}, {text: "เก็บไปคืนพร้อมส่งสายตาแพรวพราว", type: "horny"}, {text: "เก็บคืนให้แบบนิ่งๆ ไม่พูดอะไร", type: "m_serious"}, {text: "โยนคืนให้ 'หัดรักษาของบ้างสิยะ!'", type: "m_tsundere"}] },
            { q: "15. เพื่อนจับได้ว่าคุณดูซีรีส์/อนิเมะแนว 18+", 
              options: [{text: "ยืดอกรับ 'ก็ของมันดีอะ ใครๆก็ดูปะ?'", type: "horny"}, {text: "ลนลาน ปฏิเสธเสียงหลง", type: "m_shy"}, {text: "แถว่ากดผิด ไม่ได้ตั้งใจจะดูเว้ย!", type: "m_stubborn"}, {text: "คุณเป็นเป้าหมายโดนล้อเรื่องนี้ไปตลอดปี", type: "m_bullied"}] },
            { q: "16. เมื่อต้องเป็นหัวหน้าห้อง", 
              options: [{text: "ทำไม่ได้หรอก ให้คนอื่นทำเถอะ ขอตามดีกว่า", type: "m_follower"}, {text: "รับผิดชอบเต็มที่ วางแผนเป๊ะ", type: "m_serious"}, {text: "โดนเพื่อนโหวตแกล้งให้เป็นแบบงงๆ", type: "m_bullied"}, {text: "ได้ตำแหน่งมาเพราะจับฉลากได้ (ซวยจัด)", type: "m_unlucky"}] },
            { q: "17. ไปสวนสนุก คุณจะเล่นเครื่องเล่นอะไร?", 
              options: [{text: "รถไฟเหาะตีลังกาที่น่ากลัวที่สุด!", type: "m_challenge"}, {text: "เพื่อนลากไปเล่นอะไรก็เล่นตามนั้น", type: "m_follower"}, {text: "ม้าหมุน หรืออะไรที่ไม่น่ากลัว (เขิน)", type: "m_shy"}, {text: "'ไม่อยากเล่นหรอกนะ แต่เพื่อนบังคับ!'", type: "m_tsundere"}] },
            { q: "18. เพื่อนวิจารณ์เสื้อผ้าที่คุณใส่", 
              options: [{text: "'หุบปากไปเลย!' (แต่พรุ่งนี้ไม่ใส่ตัวนี้ละ)", type: "m_stubborn"}, {text: "เล่นมุกว่านี่คือแฟชั่นล้ำยุคจากอนาคต", type: "m_funny"}, {text: "แอบจดชื่อเพื่อนลงบัญชีดำในใจ", type: "psycho"}, {text: "เสียความมั่นใจ ยืนหงอย โดนแกล้งประจำ", type: "m_bullied"}] },
            { q: "19. ฝนตกหนักและคุณลืมเอาร่มมา", 
              options: [{text: "เดินตากฝนเปียกๆ เท่ๆ ไปเลย", type: "m_serious"}, {text: "วิ่งหลบฝนแต่ดันล้มโคลนกระเด็นใส่ (ซวยสุด)", type: "m_unlucky"}, {text: "รอขอติดร่มเพื่อนไปอย่างสงบเจียมตัว", type: "m_follower"}, {text: "ท้าวิ่งแข่งกับเพื่อนฝ่าพายุฝน", type: "m_challenge"}] },
            { q: "20. คุณชอบฟังเพลงแนวไหนเวลาอยู่คนเดียว?", 
              options: [{text: "เพลงรักที่จินตนาการถึงหน้าใครบางคนจนคลั่ง", type: "psycho"}, {text: "เพลงที่มีจังหวะยั่วยวน เซ็กซี่ๆ", type: "horny"}, {text: "เพลงเศร้าๆ บิ๊วอารมณ์ให้ตัวเองร้องไห้", type: "m_shy"}, {text: "เพลงอะไรก็ได้ที่กำลังฮิต (ตามเทรนด์เพื่อน)", type: "m_follower"}] },
            { q: "21. โดนเพื่อนทิ้งให้อยู่เฝ้ากระเป๋า", 
              options: [{text: "นั่งเฝ้าเงียบๆ ชินแล้วโดนประจำนี่แหละเรา", type: "m_bullied"}, {text: "บ่นกระปอดกระแปดแต่ก็เฝ้าให้ฟอร์มๆ", type: "m_stubborn"}, {text: "รื้อดูกระเป๋าเพื่อนเล่นๆ (แอบอยากรู้ความลับ)", type: "psycho"}, {text: "นั่งเฝ้าจนหลับ เพื่อนก็ไม่กลับมาสักที ทิ้งไว้กลางทาง", type: "m_unlucky"}] },
            { q: "22. เมื่อเจอสุนัขดุเห่าใส่", 
              options: [{text: "วิ่งหนีสุดชีวิต แต่สะดุดล้มหน้าคะมำ", type: "m_unlucky"}, {text: "ยืนจ้องตา ท้าทายกลับ ใครกระพริบตาก่อนแพ้", type: "m_challenge"}, {text: "หลบหลังเพื่อน ให้เพื่อนรับหน้าแทน", type: "m_follower"}, {text: "เห่ากลับ เอาให้ฮา เพื่อนขำกลิ้ง", type: "m_funny"}] },
            { q: "23. ทะเลาะกับเพื่อนสนิท คุณจะ...", 
              options: [{text: "'ชิ! ใครจะไปง้อก่อนล่ะ!' (แต่เดินป้วนเปี้ยนใกล้ๆ)", type: "m_tsundere"}, {text: "ใช้เหตุผลคุยกันตรงๆ นิ่งๆ เคลียร์ใจ", type: "m_serious"}, {text: "ทำตัวตลกๆ ง้อด้วยมุกฮาๆ ให้บรรยากาศดีขึ้น", type: "m_funny"}, {text: "ตามสืบว่าเพื่อนไปบ่นเรื่องเราให้ใครฟังไหม จะได้ไปจัดการ", type: "psycho"}] },
            { q: "24. เพื่อนแอบถ่ายรูปหลุดของคุณตอนหลับ", 
              options: [{text: "อ้อนวอนขอให้ลบเถอะนะ ปิดหน้าเขินอาย", type: "m_shy"}, {text: "โดนเอาไปทำมีมประจำกลุ่ม และโดนแซวทั้งเทอม", type: "m_bullied"}, {text: "โพสต์ท่าต่อหน้ากล้องไปเลยตอนตื่น เอาให้เซ็กซี่", type: "horny"}, {text: "ท้าว่าถ้าไม่ลบ เจอรูปหลุดคืนแน่ ศึกล้างแค้นเริ่ม!", type: "m_challenge"}] },
            { q: "25. ถ้าได้เกิดใหม่ในต่างโลก", 
              options: [{text: "ขอเป็นลูกน้องผู้กล้า สบายดี ไม่ต้องคิดเยอะ", type: "m_follower"}, {text: "เกิดใหม่ทั้งที ขอฮาเร็มสาว/หนุ่ม! เซอร์วิสรัวๆ", type: "horny"}, {text: "เกิดเป็นชาวบ้านธรรมดาที่โดนก็อบลินตีตายตั้งแต่ตอนแรก", type: "m_unlucky"}, {text: "เป็นนักรบเงียบขรึม สุดเท่ ยืนกอดอกมุมห้อง", type: "m_serious"}] },
            { q: "26. เพื่อนชวนไปกินข้าวร้านแพงๆ แต่ตังค์ไม่พอ", 
              options: [{text: "บอกไปตรงๆ ว่าไม่มีตังค์ ยืมหน่อยดิเพื่อนรัก", type: "m_funny"}, {text: "แกล้งบอกว่า 'ไม่อยากกินหรอกร้านนี้ ไร้สาระ!'", type: "m_stubborn"}, {text: "โดนเพื่อนลากไปแล้วสุดท้ายต้องล้างจานใช้หนี้", type: "m_unlucky"}, {text: "ไม่ไป ปฏิเสธเด็ดขาด เด็ดเดี่ยวมาก", type: "m_serious"}] },
            { q: "27. คุณมีของสะสมอะไร?", 
              options: [{text: "รูปถ่ายของคนที่ชอบ (ที่แอบถ่ายมาทีละใบ)", type: "psycho"}, {text: "โดจิน/ฟิกเกอร์สาย 18+ ซ่อนไว้ใต้เตียง", type: "horny"}, {text: "ของแปลกๆ ที่ท้าให้ตัวเองปีนเขาไปหามาได้", type: "m_challenge"}, {text: "ไม่มีเลย เพื่อนสะสมอะไรก็ซื้อตามบ้าง", type: "m_follower"}] },
            { q: "28. เพื่อนทักว่าอ้วนขึ้นนะ", 
              options: [{text: "ทำหน้าจะร้องไห้ เสียเซลฟ์หนักมาก", type: "m_shy"}, {text: "'ตาบอดป่าว เสื้อตัวนี้มันพองย่ะ!'", type: "m_tsundere"}, {text: "ก็ของกินมันอร่อยอ่ะ ลูบพุงโชว์เลย", type: "m_funny"}, {text: "โดนล้อเรื่องน้ำหนักยันลูกบวช เป็นเหยื่อตลอด", type: "m_bullied"}] },
            { q: "29. เมื่อเจอแมลงสาบในห้อง", 
              options: [{text: "หยิบอาวุธขึ้นมา สู้กับมัน! ตาต่อตา ฟันต่อฟัน", type: "m_challenge"}, {text: "วิ่งหนีไปเกาะหลังคนอื่น ร้องเสียงหลง", type: "m_follower"}, {text: "จับมันไปใส่กระเป๋าเพื่อน แผนชั่วร้าย", type: "psycho"}, {text: "ตีพลาด ของตกแตกเต็มห้อง แมลงสาบรอด(ซวย)", type: "m_unlucky"}] },
            { q: "30. คำพูดติดปากของคุณคือ?", 
              options: [{text: "'เปล่าสักหน่อย! อย่ามามั่ว!'", type: "m_stubborn"}, {text: "'หึ... ช่างเถอะ' (นิ่งๆ คูลๆ)", type: "m_serious"}, {text: "'ไม่ได้ชอบให้แกล้งหรอกนะ ตาบ้า!'", type: "m_tsundere"}, {text: "'แฮ่ๆ / อุ๊ยตาย' (แนวฮา/หื่นนิดๆ)", type: "horny"}] }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = [];

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        
        function startQuiz() {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            currentQuestionIndex = 0;
            userAnswers = [];
            loadQuestion();
        }

        function loadQuestion() {
            const qData = questions[currentQuestionIndex];
            document.getElementById('current-q-num').innerText = currentQuestionIndex + 1;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;
            
            document.getElementById('question-text').innerText = qData.q;
            
            const backBtn = document.getElementById('back-btn');
            if (currentQuestionIndex > 0) {
                backBtn.classList.remove('hidden');
            } else {
                backBtn.classList.add('hidden');
            }
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            const shuffledOptions = [...qData.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-xl border-2 border-purple-100 text-gray-700 bg-white hover:bg-purple-50 font-medium text-lg';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt.type);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(type) {
            userAnswers[currentQuestionIndex] = type;
            currentQuestionIndex++;
            
            if (currentQuestionIndex < questions.length) {
                const qText = document.getElementById('question-text');
                const oCont = document.getElementById('options-container');
                qText.style.opacity = 0;
                oCont.style.opacity = 0;
                
                setTimeout(() => {
                    loadQuestion();
                    qText.style.opacity = 1;
                    oCont.style.opacity = 1;
                }, 200);
            } else {
                showResult();
            }
        }

        function goBack() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                const qText = document.getElementById('question-text');
                const oCont = document.getElementById('options-container');
                qText.style.opacity = 0;
                oCont.style.opacity = 0;
                setTimeout(() => {
                    loadQuestion();
                    qText.style.opacity = 1;
                    oCont.style.opacity = 1;
                }, 200);
            }
        }

        function showResult() {
            document.getElementById('progress-bar').style.width = '100%';
            setTimeout(() => {
                quizScreen.classList.add('hidden');
                resultScreen.classList.remove('hidden');
                
                let scores = {};
                userAnswers.forEach(type => {
                    scores[type] = (scores[type] || 0) + 1;
                });
                
                let maxScore = -1;
                let finalType = 'm_shy';
                
                for (let type in scores) {
                    if (scores[type] > maxScore) {
                        maxScore = scores[type];
                        finalType = type;
                    }
                }
                
                const resultData = resultTypes[finalType];
                document.getElementById('result-emoji').innerText = resultData.emoji;
                document.getElementById('result-title').innerText = resultData.title;
                document.getElementById('result-desc').innerText = resultData.desc;
            }, 300);
        }

        function resetQuiz() {
            resultScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
